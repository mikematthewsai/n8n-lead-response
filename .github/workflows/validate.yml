name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: workflows tell the truth
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bundle matches the individual workflows
        run: python3 scripts/build_bundle.py --check

      - name: Repo claims match the workflow files
        run: python3 scripts/validate.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Watchdog template checks
        working-directory: templates/tests
        run: npm install --no-audit --no-fund && node watchdog.test.js

      - name: Renewal reminder template checks
        working-directory: templates/tests
        run: node renewals.test.js
